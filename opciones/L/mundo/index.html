// ── Bucle ─────────────────────────────────────────────────────────────────────────────
function camAzimut() { const d = new THREE.Vector3(); cam.getWorldDirection(d); return Math.atan2(d.x, -d.z); }

function frame(t) {

  animarPiezas(performance.now());

  render(); }
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); composer.setSize(w, h); camP.aspect = w / h; camP.updateProjectionMatrix(); if (cam === camO) encuadrePlano(); }

window.__vista = (k, modo, hora, est) => { if (modo && modo !== ESTADO.modo) setModo(modo); if (hora != null) ESTADO.hora = hora; if (est && est !== ESTADO.estacion) { ESTADO.estacion = est; temporada(); }
